<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Htun Htun Mobile Service Voucher</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pyidaungsu:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #1e3a8a;
            --primary-accent: #2563eb;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', 'Pyidaungsu', sans-serif; background: #f8fafc; color: var(--text-dark); padding: 16px 12px 60px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 440px; }

        .input-card { background: #ffffff; border-radius: var(--radius); padding: 16px; border: 1.5px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 16px; }
        .input-label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--text-dark); }
        
        textarea { width: 100%; height: 130px; padding: 12px; font-size: 13.5px; line-height: 1.6; border: 1.5px solid var(--border); border-radius: 10px; outline: none; font-family: inherit; resize: vertical; background: #f8fafc; }
        textarea:focus { border-color: var(--primary-accent); background: #ffffff; }

        .btn-row { display: flex; gap: 8px; margin-top: 10px; }
        button { padding: 12px; font-size: 13px; font-weight: 700; border-radius: 10px; border: none; cursor: pointer; transition: 0.15s; }
        .btn-main { background: var(--primary); color: #ffffff; flex: 1; box-shadow: 0 4px 10px rgba(30,58,138,0.2); }
        .btn-main:active { transform: scale(0.98); }
        .btn-clear { background: #f1f5f9; color: var(--text-muted); width: 85px; }
        .btn-download { background: #059669; color: #ffffff; width: 100%; margin-top: 14px; padding: 14px; font-size: 14px; box-shadow: 0 4px 14px rgba(5,150,105,0.25); }

        /* ================= PREMIUM VOUCHER CARD ================= */
        .voucher-wrapper { display: flex; justify-content: center; }
        #voucherCard {
            width: 100%;
            background: #ffffff;
            border-radius: 18px;
            padding: 24px 20px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 1px solid #cbd5e1;
            position: relative;
            overflow: hidden;
        }

        #voucherCard::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: var(--primary);
        }

        .v-header { text-align: center; border-bottom: 2px dashed #cbd5e1; padding-bottom: 14px; margin-bottom: 12px; }
        .v-shop-title { font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: -0.3px; line-height: 1.3; }
        .v-address { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-weight: 500; }
        .v-phone { font-size: 11.5px; font-weight: 700; color: #1e293b; margin-top: 2px; }
        .v-badge-tag { display: inline-block; background: #f1f5f9; color: var(--text-muted); font-size: 10px; font-weight: 700; padding: 2px 10px; border-radius: 20px; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

        .v-meta-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 10px; padding: 0 2px; }

        .v-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 12px; }
        .v-table th { background: #f8fafc; color: var(--text-muted); font-weight: 700; font-size: 11px; padding: 8px 10px; text-align: left; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #e2e8f0; }
        .v-table td { padding: 9px 10px; border-bottom: 1px solid #f8fafc; color: #1e293b; }
        .td-idx { width: 24px; color: var(--text-muted); font-size: 11px; }
        .td-name { font-weight: 600; line-height: 1.4; }
        .td-val { text-align: right; font-weight: 700; color: #0f172a; white-space: nowrap; }

        .v-summary { border-top: 2px dashed #cbd5e1; padding-top: 12px; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
        .v-total-lbl { font-size: 13px; font-weight: 700; color: #475569; }
        .v-total-num { font-size: 21px; font-weight: 800; color: #059669; letter-spacing: -0.5px; }

        .v-pay-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 4px solid var(--primary);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 11.5px;
            line-height: 1.5;
            color: #334155;
            margin-bottom: 12px;
        }

        .v-footer { text-align: center; font-size: 11px; color: var(--text-muted); border-top: 1px solid #f1f5f9; padding-top: 10px; font-weight: 500; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- စာရင်းထည့်သွင်းရန် CARD -->
    <div class="input-card">
        <label class="input-label">ဝန်ဆောင်ခ / ပစ္စည်း စာရင်းရိုက်ထည့်ပါ</label>
        <textarea id="rawListInput" placeholder="Redmi Note 10 Pro LCD 55000&#10;Vivo Y15 Password Unlock 10000&#10;iPhone 11 Battery Change 35000"></textarea>
        <div class="btn-row">
            <button class="btn-clear" type="button" onclick="clearInput()">ရှင်းမည်</button>
            <button class="btn-main" type="button" onclick="buildVoucher()">ဘောက်ချာထုတ်မည်</button>
        </div>
    </div>

    <!-- ဘောက်ချာ ပြသရာနေရာ -->
    <div id="resultArea" style="display: none;">
        <div class="voucher-wrapper">
            <div id="voucherCard">
                <div class="v-header">
                    <div class="v-shop-title" id="outShopName">Htun Htun Mobile Service</div>
                    <div class="v-address" id="outAddress">မန္တလေးမြို့</div>
                    <div class="v-phone" id="outPhone">📞 09400084212</div>
                    <div class="v-badge-tag">Service Receipt</div>
                </div>

                <div class="v-meta-row">
                    <span id="outVoucherId">No: #0001</span>
                    <span id="outDateTime">ရက်စွဲ: -</span>
                </div>

                <table class="v-table">
                    <thead>
                        <tr>
                            <th class="td-idx">#</th>
                            <th>ပြုပြင်မှု / ပစ္စည်း</th>
                            <th style="text-align: right;">ကျသင့်ငွေ</th>
                        </tr>
                    </thead>
                    <tbody id="outTableBody"></tbody>
                </table>

                <div class="v-summary">
                    <span class="v-total-lbl">စုစုပေါင်း ကျသင့်ငွေ</span>
                    <span class="v-total-num" id="outGrandTotal">0 K</span>
                </div>

                <div class="v-pay-card" id="outPayBox">
                    <strong style="color: var(--primary);">💳 ငွေပေးချေရန် အကောင့်</strong><br>
                    <span id="outPayDetails">KPay: 09400084212 (Htun Htun) | Wave: 09400084212</span>
                </div>

                <div class="v-footer" id="outFooterMsg">အားပေးမှုကို အထူးကျေးဇူးတင်ရှိပါသည်</div>
            </div>
        </div>

        <button class="btn-download" type="button" onclick="saveAsImage()">📷 ဘောက်ချာအား ပုံအဖြစ် သိမ်းမည်</button>
    </div>
</div>

<script>
// ဆိုင်အချက်အလက် သတ်မှတ်ချက် (Config)
const shopConfig = {
    shopName: "Htun Htun Mobile Service",
    address: "မန္တလေးမြို့",
    phone: "09400084212",
    payInfo: "KPay: 09400084212 (Htun Htun) | Wave: 09400084212",
    footerMsg: "စိတ်တိုင်းကျ ဝန်ဆောင်မှုပေးခြင်းအတွက် ကျေးဇူးတင်ပါသည်"
};

function buildVoucher() {
    const raw = document.getElementById('rawListInput').value.trim();
    if (!raw) {
        alert("ပစ္စည်းနှင့် ဈေးနှုန်းစာရင်း ရိုက်ထည့်ပေးပါ။");
        return;
    }

    const lines = raw.split("\n");
    let sum = 0, count = 0, rowsHtml = "";

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const match = line.match(/^(.*?)[\s\t]+(\d+)$/);
        if (match) {
            count++;
            const name = match[1].trim();
            const price = parseInt(match[2], 10);
            sum += price;
            rowsHtml += `<tr>
                <td class="td-idx">${count}</td>
                <td class="td-name">${escapeHtml(name)}</td>
                <td class="td-val">${price.toLocaleString()} K</td>
            </tr>`;
        }
    }

    if (count === 0) {
        alert("စာရင်းပုံစံ မမှန်ပါ။ ဥပမာ - 'LCD 35000' ပုံစံဖြင့် ရိုက်ထည့်ပါ။");
        return;
    }

    // ဆိုင်အချက်အလက်များ တပ်ဆင်ခြင်း
    document.getElementById('outShopName').innerText = shopConfig.shopName;
    document.getElementById('outAddress').innerText = shopConfig.address;
    document.getElementById('outPhone').innerText = shopConfig.phone ? `📞 ${shopConfig.phone}` : "";
    document.getElementById('outPayDetails').innerText = shopConfig.payInfo;
    document.getElementById('outFooterMsg').innerText = shopConfig.footerMsg;

    const now = new Date();
    document.getElementById('outDateTime').innerText = now.toLocaleDateString('en-GB') + " " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    document.getElementById('outVoucherId').innerText = `No: #${now.getSeconds()}${now.getMilliseconds()}`;
    document.getElementById('outGrandTotal').innerText = sum.toLocaleString() + " K";
    document.getElementById('outTableBody').innerHTML = rowsHtml;

    document.getElementById('resultArea').style.display = "block";
    document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function clearInput() {
    document.getElementById('rawListInput').value = "";
    document.getElementById('resultArea').style.display = "none";
}

function saveAsImage() {
    if (typeof html2canvas === "undefined") {
        alert("ပုံထုတ်သည့်စနစ် ဆွဲတင်နေဆဲဖြစ်ပါသည်၊ ခေတ္တစောင့်ပေးပါ။");
        return;
    }
    const target = document.getElementById('voucherCard');
    html2canvas(target, { scale: 3, backgroundColor: null }).then(canvas => {
        const link = document.createElement("a");
        link.download = `HtunHtun_Voucher_${Date.now()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = String(text ?? '');
    return div.innerHTML;
}
</script>
</body>
</html>
